name: AI CI Agent
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  investigate:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./ai-ci-agent
        id: agent
        with:
          llm-provider: openai
          llm-api-key: ${{ secrets.LLM_API_KEY }}
        env:
          # LLM_API_KEY is currently an OpenRouter key, not a raw OpenAI
          # key — these two point the OpenAI-compatible provider at
          # OpenRouter's endpoint instead. Switch back to llm-provider:
          # claude and drop these once a funded Anthropic key is in use.
          OPENAI_BASE_URL: https://openrouter.ai/api/v1/chat/completions
          OPENAI_MODEL: openai/gpt-4o-mini

      # Discord notification for ai-ci-agent's comment is handled by a
      # repo-level GitHub webhook (Settings > Webhooks) pointed at the
      # Discord webhook URL with "/github" appended — Discord natively
      # renders GitHub-formatted webhook payloads, which looks better
      # than anything a custom curl step could produce, and needs no
      # code here. comment-url/comment-body are still exposed as action
      # outputs (see action.yml) for any other consumer that wants them.
