name: AI CI Agent
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  investigate:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./ai-ci-agent
        with:
          llm-provider: claude
          llm-api-key: ${{ secrets.LLM_API_KEY }}
